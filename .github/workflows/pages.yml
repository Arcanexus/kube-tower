name: Pages

# Publishes the product site (site/) on GitHub Pages: https://arcanexus.github.io/kube-tower/
# The screenshots and icons are copied from docs/images and the UI at build time, so the site
# always shows the screenshots of the README.
on:
  push:
    branches: ["main"]
    paths: ["site/**", "docs/images/**", "src/kube_tower/web/static/icons.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/images _site/images
          cp src/kube_tower/web/static/icons.svg _site/icons.svg
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
