name: Wiki

# Publishes docs/ to the GitHub wiki (https://github.com/Arcanexus/kube-tower/wiki) after every
# merge to main: docs/ stays the only source, the wiki is generated by .github/scripts/docs_to_wiki.py.
# The wiki must exist first: enable it in the repository settings and save a first page in the UI
# (the content is replaced by the first run).
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/scripts/docs_to_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki of ${GITHUB_REPOSITORY} does not exist yet: enable it in Settings > Features > Wikis, save a first page in the Wiki tab, then run this workflow again."
            exit 1
          fi
      - name: Build the pages from docs/
        run: python .github/scripts/docs_to_wiki.py docs wiki --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
      - name: Push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_SHA::7}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push
          echo "Wiki updated: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki" >> "$GITHUB_STEP_SUMMARY"
