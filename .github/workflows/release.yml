name: Release

# Creates the GitHub Release of a tag (v1.2.3, or v1.2.3-rc.1 marked as a pre-release), with the notes of
# its CHANGELOG section. The tag must match the versions of pyproject.toml and Chart.yaml
# (.github/scripts/release.py). A release that already exists, created by hand, is left as it is.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the versions and write the notes
        run: python .github/scripts/release.py "$GITHUB_REF_NAME" --notes notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists: left as it is"
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
