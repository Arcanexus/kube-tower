{% macro badge(status) -%}
<span class="badge badge-{{ status.value }}">{{ status.value }}</span>
{%- endmacro %}

{% macro filters(path, q, status, cluster, snapshot) -%}
<form class="filters" hx-get="{{ path }}" hx-target="#results" hx-push-url="true"
      hx-trigger="input changed delay:300ms from:input[name=q], change">
  <input type="search" name="q" value="{{ q }}" placeholder="Filter…" aria-label="Filter">
  <select name="status" aria-label="Status">
    <option value="">All statuses</option>
    {% for s in Status %}<option value="{{ s.value }}" {% if s.value == status %}selected{% endif %}>{{ s.value }}</option>{% endfor %}
  </select>
  <select name="cluster" aria-label="Cluster">
    <option value="">All clusters</option>
    {% for c in snapshot.clusters %}<option {% if c.name == cluster %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
  </select>
</form>
{%- endmacro %}
