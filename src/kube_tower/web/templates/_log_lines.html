{% for line in lines %}<div class="log-line log-{{ line.level | lower }}"><span class="log-time">{{ line.time.strftime("%Y-%m-%d %H:%M:%S") }}</span> <span class="log-level">{{ line.level }}</span> {% if distributed and line.source %}<span class="log-source" title="Roles: {{ line.roles | join(', ') }}">{{ line.source }}</span> {% endif %}<span class="log-logger">{{ line.logger }}</span> {{ line.message }}</div>
{% endfor %}
