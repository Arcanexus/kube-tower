{{- /* Every cluster Secret is read by name (config.clusters.secretNames); an existingSecret is not created. */ -}}
{{- range .Values.clusters }}
{{- if not .existingSecret }}
{{- $name := required "clusters[].name is required (or set clusters[].existingSecret)" .name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-tower.fullname" $ }}-cluster-{{ $name }}
  labels:
    {{- include "kube-tower.labels" $ | nindent 4 }}
    kube-tower.arcanexus.com/secret-type: cluster
type: Opaque
stringData:
  name: {{ $name | quote }}
  {{- if .kubeconfig }}
  kubeconfig: {{ (kindIs "string" .kubeconfig | ternary .kubeconfig (toYaml .kubeconfig)) | quote }}
  {{- else }}
  server: {{ required (printf "clusters[%s]: server or kubeconfig is required" $name) .server | quote }}
  config: {{ .config | default dict | toJson | quote }}
  {{- end }}
{{- end }}
{{- end }}
