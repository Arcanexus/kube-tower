{{- range .Values.clusters }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-tower.fullname" $ }}-cluster-{{ .name }}
  labels:
    {{- include "kube-tower.labels" $ | nindent 4 }}
    kube-tower.arcanexus.com/secret-type: cluster
type: Opaque
stringData:
  name: {{ .name | quote }}
  server: {{ .server | quote }}
  config: {{ .config | default dict | toJson | quote }}
{{- end }}
