{{- /* Credentials are mounted from Secrets: only their file paths go in the config. */ -}}
{{- $config := deepCopy .Values.config }}
{{- $credentials := list }}
{{- range $i, $c := .Values.registries.credentials }}
{{- /* Secrets created by the chart always store the password under "password" */ -}}
{{- $passwordKey := ternary ($c.passwordKey | default "password") "password" (not (empty $c.existingSecret)) }}
{{- $entry := dict "registry" (required (printf "registries.credentials[%d].registry is required" $i) $c.registry) "passwordFile" (printf "/etc/kube-tower/registries/%d/%s" $i $passwordKey) }}
{{- if and $c.existingSecret $c.usernameKey }}
{{- $_ := set $entry "usernameFile" (printf "/etc/kube-tower/registries/%d/%s" $i $c.usernameKey) }}
{{- else if $c.username }}
{{- $_ := set $entry "username" $c.username }}
{{- end }}
{{- $credentials = append $credentials $entry }}
{{- end }}
{{- $registries := deepCopy ($config.registries | default dict) }}
{{- $_ := set $registries "credentials" $credentials }}
{{- $_ := set $config "registries" $registries }}
{{- /* Existing cluster Secrets referenced in .Values.clusters are read by name */ -}}
{{- $clusters := deepCopy ($config.clusters | default dict) }}
{{- $secretNames := concat ($clusters.secretNames | default list) (include "kube-tower.clusterSecretNames" . | fromJsonArray) | uniq }}
{{- if $secretNames }}
{{- $_ := set $clusters "secretNames" $secretNames }}
{{- $_ := set $config "clusters" $clusters }}
{{- end }}
{{- /* The chart's Trivy server, unless another server is configured */ -}}
{{- if .Values.trivy.server.enabled }}
{{- $vulnerabilities := deepCopy ($config.vulnerabilities | default dict) }}
{{- $trivy := deepCopy ($vulnerabilities.trivy | default dict) }}
{{- if not $trivy.serverUrl }}
{{- $_ := set $trivy "serverUrl" (printf "http://%s-trivy:%v" (include "kube-tower.fullname" .) .Values.trivy.server.port) }}
{{- end }}
{{- $_ := set $vulnerabilities "trivy" $trivy }}
{{- $_ := set $config "vulnerabilities" $vulnerabilities }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-tower.fullname" . }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
