{{- /* Credentials are mounted from Secrets: only their file paths go in the config. */ -}}
{{- $config := deepCopy .Values.config }}
{{- $credentials := list }}
{{- range $i, $c := .Values.registries.credentials }}
{{- if and $c.provider (ne $c.provider "static") }}
{{- /* Cloud providers: short-lived tokens from the identity of the pod, no Secret */ -}}
{{- $credentials = append $credentials (dict "registry" (required (printf "registries.credentials[%d].registry is required" $i) $c.registry) "provider" $c.provider) }}
{{- else }}
{{- /* Secrets created by the chart always store the password under "password" */ -}}
{{- $passwordKey := ternary ($c.passwordKey | default "password") "password" (not (empty $c.existingSecret)) }}
{{- $entry := dict "registry" (required (printf "registries.credentials[%d].registry is required" $i) $c.registry) "passwordFile" (printf "/etc/kube-tower/registries/%d/%s" $i $passwordKey) }}
{{- if and $c.existingSecret $c.usernameKey }}
{{- $_ := set $entry "usernameFile" (printf "/etc/kube-tower/registries/%d/%s" $i $c.usernameKey) }}
{{- else if $c.username }}
{{- $_ := set $entry "username" $c.username }}
{{- end }}
{{- $credentials = append $credentials $entry }}
{{- end }}
{{- end }}
{{- $registries := deepCopy ($config.registries | default dict) }}
{{- $_ := set $registries "credentials" $credentials }}
{{- if include "kube-tower.caConfigMapName" . }}
{{- $_ := set $registries "caFile" "/etc/kube-tower/ca/ca.crt" }}
{{- end }}
{{- $_ := set $config "registries" $registries }}
{{- /* Existing cluster Secrets referenced in .Values.clusters are read by name */ -}}
{{- $clusters := deepCopy ($config.clusters | default dict) }}
{{- $secretNames := concat ($clusters.secretNames | default list) (include "kube-tower.clusterSecretNames" . | fromJsonArray) | uniq }}
{{- if $secretNames }}
{{- $_ := set $clusters "secretNames" $secretNames }}
{{- $_ := set $config "clusters" $clusters }}
{{- end }}
{{- /* The Trivy CLI copied by the init container, and the chart's Trivy server unless another one is configured */ -}}
{{- $vulnerabilities := deepCopy ($config.vulnerabilities | default dict) }}
{{- $trivy := deepCopy ($vulnerabilities.trivy | default dict) }}
{{- with include "kube-tower.trivyBinary" . }}
{{- if not $trivy.binary }}
{{- $_ := set $trivy "binary" . }}
{{- end }}
{{- end }}
{{- if and .Values.trivy.server.enabled (not $trivy.serverUrl) }}
{{- $_ := set $trivy "serverUrl" (printf "http://%s-trivy:%v" (include "kube-tower.fullname" .) .Values.trivy.server.port) }}
{{- end }}
{{- if $trivy }}
{{- $_ := set $vulnerabilities "trivy" $trivy }}
{{- $_ := set $config "vulnerabilities" $vulnerabilities }}
{{- end }}
{{- /* Distributed mode: the election of the controller (its Lease, see rbac.yaml); the active controller
labels its pod, selected by the controller Service */ -}}
{{- if include "kube-tower.distributed" . }}
{{- $internal := deepCopy ($config.internal | default dict) }}
{{- $_ := set $internal "leaderElection" true }}
{{- $_ := set $internal "labelPod" true }}
{{- $_ := set $internal "leaseName" (printf "%s-controller" (include "kube-tower.fullname" .)) }}
{{- $_ := set $config "internal" $internal }}
{{- end }}
{{- /* Login: the passwords are mounted from Secrets, only their paths go in the config */ -}}
{{- if .Values.auth.enabled }}
{{- $users := list }}
{{- range $i, $u := .Values.auth.users }}
{{- $name := required (printf "auth.users[%d].name is required" $i) $u.name }}
{{- $secret := required (printf "auth.users[%d].existingSecret is required (Secret holding the password)" $i) $u.existingSecret }}
{{- $users = append $users (dict "name" $name "role" ($u.role | default "readonly") "passwordFile" (printf "/etc/kube-tower/users/%d/%s" $i ($u.passwordKey | default "password"))) }}
{{- end }}
{{- $auth := dict "enabled" true "admin" .Values.auth.admin "users" $users "anonymousRole" .Values.auth.anonymousRole "sessionDuration" .Values.auth.sessionDuration "metricsPublic" .Values.auth.metricsPublic "secretName" (include "kube-tower.authSecretName" .) "secretDir" "/etc/kube-tower/auth" }}
{{- with .Values.auth.oidc }}
{{- if .issuer }}
{{- /* The client secret comes from its Secret as $KUBE_TOWER_OIDC_CLIENT_SECRET */ -}}
{{- $oidc := omit . "clientSecret" }}
{{- $_ := set $auth "oidc" $oidc }}
{{- $_ := set $auth "url" (required "auth.url is required with auth.oidc.issuer: the URL users open kube-tower with" $.Values.auth.url) }}
{{- end }}
{{- end }}
{{- if .Values.dex.enabled }}
{{- /* The Dex of the chart, served on <url>api/dex: kube-tower reaches it through its Service */ -}}
{{- $issuer := include "kube-tower.dexIssuer" . }}
{{- $oidc := omit .Values.auth.oidc "clientSecret" }}
{{- $_ := set $oidc "name" .Values.dex.name }}
{{- $_ := set $oidc "issuer" $issuer }}
{{- $_ := set $oidc "clientId" "kube-tower" }}
{{- $_ := set $oidc "clientSecretFile" "/etc/kube-tower/auth/dex.clientSecret" }}
{{- $_ := set $oidc "providerUrl" (printf "%s%s" (include "kube-tower.dexUrl" .) (urlParse $issuer).path) }}
{{- $_ := set $auth "oidc" $oidc }}
{{- $_ := set $auth "url" .Values.auth.url }}
{{- $_ := set $auth "dexUrl" (include "kube-tower.dexUrl" .) }}
{{- end }}
{{- $_ := set $config "auth" $auth }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-tower.fullname" . }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
{{- if and .Values.registries.ca.pem (not .Values.registries.ca.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-tower.fullname" . }}-ca
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.registries.ca.pem | nindent 4 }}
{{- end }}
