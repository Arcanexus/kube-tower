{{- if .Values.rbac.create }}
# Read-only access needed to inventory the local cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-tower.fullname" . }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # Trivy Operator reports, when it is installed (vulnerabilities of the images, and the Security page)
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - configauditreports
      - clusterconfigauditreports
      - exposedsecretreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
      - infraassessmentreports
      - clusterinfraassessmentreports
      - clustercompliancereports
    verbs: ["get", "list"]
  {{- if (.Values.config.registries | default dict).useImagePullSecrets }}
  # Image pull secrets of the workloads (config.registries.useImagePullSecrets): `get` cannot be limited
  # to some Secrets by name in every namespace, so this reads any Secret whose name is known
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-tower.fullname" . }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-tower.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-tower.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- $names := concat (.Values.config.clusters.secretNames | default list) (include "kube-tower.clusterSecretNames" . | fromJsonArray) | uniq }}
{{- if or $names .Values.config.clusters.listSecrets }}
---
# Read the cluster registration Secrets of the release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-tower.fullname" . }}-cluster-secrets
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
rules:
  {{- if $names }}
  # Cluster Secrets read by name: only these ones
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $names | nindent 6 }}
    verbs: ["get"]
  {{- end }}
  {{- if .Values.config.clusters.listSecrets }}
  # Labelled cluster Secrets (config.clusters.listSecrets): list reads every Secret of the namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-tower.fullname" . }}-cluster-secrets
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-tower.fullname" . }}-cluster-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-tower.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.config.clusters.useArgocdSecrets }}
---
# Reuse ArgoCD cluster secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-tower.fullname" . }}-argocd-clusters
  namespace: {{ .Values.config.clusters.argocdNamespace }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
rules:
  {{- with .Values.config.clusters.argocdSecretNames }}
  # ArgoCD cluster Secrets read by name: only these ones
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["get"]
  {{- else }}
  # Listing reads every Secret of the ArgoCD namespace (argocd-secret, repository credentials...):
  # set config.clusters.argocdSecretNames to read only the cluster Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-tower.fullname" . }}-argocd-clusters
  namespace: {{ .Values.config.clusters.argocdNamespace }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-tower.fullname" . }}-argocd-clusters
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-tower.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if include "kube-tower.distributed" . }}
---
# Election of the active controller (distributed mode): the Lease of the controllers
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-tower.fullname" . }}-leader-election
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["{{ include "kube-tower.fullname" . }}-controller"]
    verbs: ["get", "update"]
  # The active controller labels its own pod (kube-tower.arcanexus.com/active-controller)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-tower.fullname" . }}-leader-election
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-tower.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-tower.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
