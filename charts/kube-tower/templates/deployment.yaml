apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-tower.fullname" . }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-tower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-tower.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kube-tower.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kube-tower
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.git.existingSecret }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.existingSecret }}
                  key: {{ .Values.git.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kube-tower/config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
            {{- if .Values.registries.existingSecret }}
            - name: dockerconfig
              mountPath: /etc/kube-tower/dockerconfig
              readOnly: true
            {{- end }}
            {{- range $i, $c := .Values.registries.credentials }}
            - name: registry-{{ $i }}
              mountPath: /etc/kube-tower/registries/{{ $i }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kube-tower.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.registries.existingSecret }}
        - name: dockerconfig
          secret:
            secretName: {{ .Values.registries.existingSecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- range $i, $c := .Values.registries.credentials }}
        - name: registry-{{ $i }}
          secret:
            secretName: {{ required "registries.credentials[].existingSecret is required" $c.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
