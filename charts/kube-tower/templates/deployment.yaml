{{- $distributed := include "kube-tower.distributed" . }}
{{- $redisUrl := include "kube-tower.redisUrl" . }}
{{- range $name, $g := include "kube-tower.groups" . | fromJson }}
{{- $roles := $g.roles }}
{{- /* Groups with only the ui role reach no Kubernetes API, registry nor git host */ -}}
{{- $uiOnly := and (has "ui" $roles) (eq (len $roles) 1) }}
{{- $trivy := and (has "trivy" $roles) (include "kube-tower.trivyBinary" $) }}
{{- $controller := has "controller" $roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-tower.fullname" $ }}{{ with $name }}-{{ . }}{{ end }}
  labels:
    {{- include "kube-tower.labels" $ | nindent 4 }}
    {{- with $name }}
    app.kubernetes.io/component: {{ . }}
    {{- end }}
spec:
  {{- if not $g.autoscaling.enabled }}
  replicas: {{ $g.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kube-tower.selectorLabels" $ | nindent 6 }}
      {{- with $name }}
      app.kubernetes.io/component: {{ . }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "kube-tower.selectorLabels" $ | nindent 8 }}
        {{- if $distributed }}
        app.kubernetes.io/component: {{ $name }}
        {{- range $roles }}
        kube-tower.arcanexus.com/{{ . }}: "true"
        {{- end }}
        {{- end }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/credentials: {{ include (print $.Template.BasePath "/credential-secrets.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kube-tower.serviceAccountName" $ }}
      {{- if $uiOnly }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if or $trivy $.Values.extraInitContainers }}
      initContainers:
      {{- end }}
      {{- if $trivy }}
        # Copies the Trivy CLI from the official image, so the kube-tower image stays small
        - name: trivy
          image: "{{ $.Values.trivy.image.repository }}:{{ $.Values.trivy.image.tag }}"
          imagePullPolicy: {{ $.Values.trivy.image.pullPolicy }}
          command: ["cp", "/usr/local/bin/trivy", "/opt/trivy/bin/trivy"]
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: trivy-bin
              mountPath: /opt/trivy/bin
      {{- end }}
      {{- with $.Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-tower
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $distributed }}
            - name: KUBE_TOWER_ROLES
              value: {{ join "," $roles | quote }}
            - name: KUBE_TOWER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kube-tower.internalSecretName" $ }}
                  key: {{ ternary $.Values.distributed.internal.secretKey "token" (not (empty $.Values.distributed.internal.existingSecret)) }}
            {{- if not $controller }}
            - name: KUBE_TOWER_CONTROLLER_URL
              value: "http://{{ include "kube-tower.fullname" $ }}-internal:{{ $.Values.distributed.internal.port }}"
            {{- end }}
            {{- end }}
            {{- if and $controller $redisUrl }}
            - name: KUBE_TOWER_REDIS_URL
              value: {{ $redisUrl | quote }}
            {{- with include "kube-tower.redisSecretName" $ }}
            - name: KUBE_TOWER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ ternary $.Values.redis.passwordKey "password" (not (empty $.Values.redis.existingSecret)) }}
            {{- end }}
            {{- end }}
            {{- if not $uiOnly }}
            {{- with include "kube-tower.gitSecretName" $ }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ ternary $.Values.git.secretKey "token" (not (empty $.Values.git.existingSecret)) }}
            {{- end }}
            {{- end }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if and $distributed $controller }}
            - name: internal
              containerPort: {{ $.Values.distributed.internal.port }}
            {{- end }}
          {{- with $.Values.startupProbe }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.readinessProbe }}
          readinessProbe:
            httpGet:
              {{- /* Controller pods (distributed): only the active controller, the Lease holder, is ready */}}
              path: {{ ternary "/leaderz" "/healthz" (and (not (empty $distributed)) $controller) }}
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kube-tower/config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
            {{- if or (not $distributed) (has "trivy" $roles) }}
            - name: trivy-cache
              mountPath: /tmp/trivy
            {{- end }}
            {{- if $trivy }}
            - name: trivy-bin
              mountPath: /opt/trivy/bin
              readOnly: true
            {{- end }}
            {{- if not $uiOnly }}
            {{- if include "kube-tower.dockerConfigSecretName" $ }}
            - name: dockerconfig
              mountPath: /etc/kube-tower/dockerconfig
              readOnly: true
            {{- end }}
            {{- range $i, $c := $.Values.registries.credentials }}
            {{- if or (not $c.provider) (eq $c.provider "static") }}
            - name: registry-{{ $i }}
              mountPath: /etc/kube-tower/registries/{{ $i }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if include "kube-tower.caConfigMapName" $ }}
            - name: registry-ca
              mountPath: /etc/kube-tower/ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kube-tower.fullname" $ }}
        - name: tmp
          emptyDir: {}
        {{- if $trivy }}
        - name: trivy-bin
          emptyDir: {}
        {{- end }}
        {{- if or (not $distributed) (has "trivy" $roles) }}
        - name: trivy-cache
          emptyDir:
            {{- with $.Values.trivy.cacheSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- end }}
        {{- if not $uiOnly }}
        {{- with include "kube-tower.dockerConfigSecretName" $ }}
        - name: dockerconfig
          secret:
            secretName: {{ . }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- range $i, $c := $.Values.registries.credentials }}
        {{- if or (not $c.provider) (eq $c.provider "static") }}
        - name: registry-{{ $i }}
          secret:
            secretName: {{ include "kube-tower.registrySecretName" (dict "root" $ "index" $i) }}
        {{- end }}
        {{- end }}
        {{- with include "kube-tower.caConfigMapName" $ }}
        - name: registry-ca
          configMap:
            name: {{ . }}
            items:
              - key: {{ if $.Values.registries.ca.existingConfigMap }}{{ $.Values.registries.ca.key | default "ca.crt" }}{{ else }}ca.crt{{ end }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kube-tower.fullname" $ }}-{{ $name }}
  labels:
    {{- include "kube-tower.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kube-tower.fullname" $ }}-{{ $name }}
  minReplicas: {{ $g.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ required (printf "distributed.groups.%s.autoscaling.maxReplicas is required" $name) $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
{{- end }}
