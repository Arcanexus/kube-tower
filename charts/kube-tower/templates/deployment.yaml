apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-tower.fullname" . }}
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-tower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-tower.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ include (print $.Template.BasePath "/credential-secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kube-tower.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or (include "kube-tower.trivyBinary" .) .Values.extraInitContainers }}
      initContainers:
      {{- end }}
      {{- if include "kube-tower.trivyBinary" . }}
        # Copies the Trivy CLI from the official image, so the kube-tower image stays small
        - name: trivy
          image: "{{ .Values.trivy.image.repository }}:{{ .Values.trivy.image.tag }}"
          imagePullPolicy: {{ .Values.trivy.image.pullPolicy }}
          command: ["cp", "/usr/local/bin/trivy", "/opt/trivy/bin/trivy"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: trivy-bin
              mountPath: /opt/trivy/bin
      {{- end }}
      {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-tower
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with include "kube-tower.gitSecretName" . }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ ternary $.Values.git.secretKey "token" (not (empty $.Values.git.existingSecret)) }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- with .Values.startupProbe }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kube-tower/config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
            - name: trivy-cache
              mountPath: /tmp/trivy
            {{- if include "kube-tower.trivyBinary" . }}
            - name: trivy-bin
              mountPath: /opt/trivy/bin
              readOnly: true
            {{- end }}
            {{- if include "kube-tower.dockerConfigSecretName" . }}
            - name: dockerconfig
              mountPath: /etc/kube-tower/dockerconfig
              readOnly: true
            {{- end }}
            {{- range $i, $c := .Values.registries.credentials }}
            - name: registry-{{ $i }}
              mountPath: /etc/kube-tower/registries/{{ $i }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kube-tower.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if include "kube-tower.trivyBinary" . }}
        - name: trivy-bin
          emptyDir: {}
        {{- end }}
        - name: trivy-cache
          emptyDir:
            {{- with .Values.trivy.cacheSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- with include "kube-tower.dockerConfigSecretName" . }}
        - name: dockerconfig
          secret:
            secretName: {{ . }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- range $i, $c := .Values.registries.credentials }}
        - name: registry-{{ $i }}
          secret:
            secretName: {{ include "kube-tower.registrySecretName" (dict "root" $ "index" $i) }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
