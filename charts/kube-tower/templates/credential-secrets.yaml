{{- /* Registry and git credentials given inline in the values. An existingSecret always wins. */ -}}
{{- range $i, $c := .Values.registries.credentials }}
{{- if and (not $c.existingSecret) $c.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-tower.registrySecretName" (dict "root" $ "index" $i) }}
  labels:
    {{- include "kube-tower.labels" $ | nindent 4 }}
type: Opaque
stringData:
  password: {{ $c.password | quote }}
{{- end }}
{{- end }}
{{- if and (not .Values.registries.existingSecret) .Values.registries.dockerConfigJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-tower.fullname" . }}-dockerconfig
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  {{- $json := .Values.registries.dockerConfigJson }}
  .dockerconfigjson: {{ (kindIs "string" $json | ternary $json (toJson $json)) | quote }}
{{- end }}
{{- if and (not .Values.git.existingSecret) .Values.git.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-tower.fullname" . }}-git
  labels:
    {{- include "kube-tower.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.git.token | quote }}
{{- end }}
