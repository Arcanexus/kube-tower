image:
  repository: ghcr.io/arcanexus/kube-tower
  # Defaults to the chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# single: one Deployment whose pod runs every role (ui, controller, worker, trivy).
# distributed: one Deployment per entry of distributed.groups, each running some roles, scaled apart.
mode: single

# Single mode: the inventory is in the memory of the pod, keep a single replica.
replicaCount: 1

# Distributed mode (see docs/scaling.md). Every role runs in at least one group; controller and trivy
# in one only. Set a group to null to remove it, e.g. to run controller and ui together.
distributed:
  groups:
    controller:
      roles: [controller]
      # One active controller, the others wait as standbys and take over (Kubernetes Lease)
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    ui:
      roles: [ui]
      # One pod serves about 10 users at a few millicores each: a page costs 5 to 25 ms of CPU with
      # 150 images and 50 charts (the CPU request is what the autoscaling target is a share of).
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          memory: 512Mi
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 80
        # Scale up by one pod at most every minute, after 2 minutes above the target (a page load or a
        # pod start does not add pods); scale down after 5 minutes below it.
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 120
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
    worker:
      roles: [worker]
      # Mostly waiting for the registries: the batches of a scan are shared by the workers.
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 80
        # Scale up by one pod at most every minute, after 2 minutes above the target (a page load or a
        # pod start does not add pods); scale down after 5 minutes below it.
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 120
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
    trivy:
      roles: [trivy]
      # Always one replica (it keeps the Trivy databases and results), never autoscaled
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi

# Redis / Valkey. Required by mode distributed: the pods talk through it (ADR 0003). In both modes the
# controller keeps a copy of the inventory there: a restarted controller (or a standby taking over) shows
# it at once instead of scanning first.
redis:
  # A Valkey deployed by the chart (one pod, data in memory)...
  valkey:
    enabled: false
    image:
      repository: docker.io/valkey/valkey
      tag: "8.1.1"
      pullPolicy: IfNotPresent
    port: 6379
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
  # ...or an existing Redis / Valkey: redis://host:6379/0, rediss:// for TLS.
  url: ""
  # Password (optional, also set on the chart's Valkey): an existing Secret...
  existingSecret: ""
  passwordKey: password
  # ...or the password itself, the chart then creates the Secret.
  password: ""
  # Prefix of the keys of the distributed mode (empty: the release name), for several installations sharing
  # one Redis.
  keyPrefix: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # ClusterRole with read-only access to workloads, nodes and ArgoCD Applications
  create: true

# Application settings, rendered into the kube-tower ConfigMap (config.yaml).
# See docs/configuration.md for every option.
config:
  refreshInterval: 6h
  logs:
    level: INFO
    format: json
  clusters:
    inCluster: true
    inClusterName: in-cluster
    # Cluster Secrets of `clusters` below are read by name (get on these Secrets only). Set
    # listSecrets to also find the Secrets of the namespace labelled with secretLabelSelector (e.g.
    # created by ExternalSecrets): it needs `list` on secrets, which reads EVERY Secret of the namespace.
    listSecrets: false
    secretLabelSelector: kube-tower.arcanexus.com/secret-type=cluster
    # Reuse ArgoCD cluster secrets. Without argocdSecretNames they are listed, which gives read access
    # to EVERY Secret of argocdNamespace (argocd-secret, repository credentials...): prefer listing the
    # names of the ArgoCD cluster Secrets in argocdSecretNames.
    useArgocdSecrets: false
    argocdNamespace: argocd
    argocdSecretNames: []
    # Commands that kubeconfig exec plugins may run, as written in the kubeconfig (e.g.
    # /opt/kube-tower/bin/kubelogin). Empty: exec plugins are refused. See docs/clusters.md.
    execCommands: []
  images:
    includeNodeImages: true
    includePrerelease: false
    checkFloatingDigests: true
    # Read the published digests of the current and latest tags (shown in the image details)
    fetchTagDigests: true
    ignore: []
  helm:
    applicationNamespaces:
      - argocd
    includePrerelease: false
    checkDependencies: true
  # Known vulnerabilities (CVE) of the images, see docs/vulnerabilities.md
  vulnerabilities:
    enabled: true
    # Read the VulnerabilityReports of Trivy Operator in the clusters where it is installed
    trivyOperator: true
    trivy:
      # Scan with the Trivy CLI the images without a Trivy Operator report (binary from trivy.image)
      enabled: true
      # Trivy server URL (client/server mode); set automatically when trivy.server.enabled is true
      serverUrl: ""
      timeout: 10m
      concurrency: 2
      # Images are scanned again after this delay, to find newly published CVEs
      rescanInterval: 24h
      ignoreUnfixed: false
      # Java DB (~1.5 GB more in the cache) to scan Java archives (jar, war...), skipped when disabled
      javaDb: false
    # Images never scanned (fnmatch patterns on registry/repository)
    ignore: []
  # Security page: the other reports of Trivy Operator (config audit, exposed secrets, RBAC, infrastructure,
  # compliance), shown when it is installed in a cluster, see docs/security.md
  security:
    enabled: true
    # Exposed secrets: the lines Trivy found, the secret masked; false to leave them out
    exposedSecrets: true
  registries:
    # Also use the image pull secrets of the pods and workloads (read in their namespace): adds `get` on
    # secrets in EVERY namespace to the ClusterRole. Remote clusters need it in their own RBAC.
    useImagePullSecrets: false
    # Registries whose TLS certificate is not verified, reached over plain http:// when they do not
    # answer in https:// (fnmatch patterns, e.g. registry.local:5000). Prefer registries.ca below.
    insecure: []

# Remote clusters to register (see docs/clusters.md). Each entry either:
#  - creates a Secret in the kube-tower cluster format (ArgoCD layout or kubeconfig), or
#  - references an existing Secret by name (existingSecret), e.g. one generated by ExternalSecrets.
# Any Secret labelled kube-tower.arcanexus.com/secret-type=cluster in the release namespace is also
# used, without listing it here. Prefer existing Secrets to keep tokens out of git.
clusters: []
#  - name: prod
#    server: https://prod.example.com:6443
#    config:
#      bearerToken: "<token>"
#      tlsClientConfig:
#        caData: "<base64 PEM>"
#  - name: lab
#    kubeconfig: |
#      apiVersion: v1
#      kind: Config
#      ...
#  # Existing Secret (name/server/config or kubeconfig keys), its labels do not matter
#  - existingSecret: staging-cluster

registries:
  # Per registry credentials, for private registries / Helm repositories and to avoid
  # Docker Hub rate limits, mounted read-only from one Secret per registry.
  # Applies to container registries, OCI Helm registries and HTTP Helm repositories (basic auth).
  # Either reference an existing Secret (existingSecret wins) or give the password inline and the
  # chart creates the Secret.
  # `registry` is a host or an fnmatch pattern of hosts. Cloud registries can use the identity of the
  # pod instead of a Secret (provider: aws, gcp or azure, see docs/registries.md).
  credentials: []
  #  - registry: "*.dkr.ecr.*.amazonaws.com"   # Amazon ECR, IAM role of the ServiceAccount (IRSA / Pod Identity)
  #    provider: aws
  #  - registry: "*-docker.pkg.dev"            # Artifact Registry, GKE Workload Identity
  #    provider: gcp
  #  - registry: myacr.azurecr.io              # ACR, AKS Workload Identity (podLabels)
  #    provider: azure
  #  - registry: docker.io
  #    existingSecret: dockerhub-credentials
  #    usernameKey: username   # optional, omit for token-only registries
  #    passwordKey: password   # password or access token
  #  - registry: ghcr.io
  #    existingSecret: ghcr-token
  #    passwordKey: token
  #  - registry: quay.io        # Secret created by the chart
  #    username: robot          # optional, kept in the ConfigMap
  #    password: "<token>"

  # Alternatively (or in addition), a kubernetes.io/dockerconfigjson Secret holding credentials
  # for several registries at once: an existing one...
  existingSecret: ""
  # ...or its content (an object, or a JSON string), the chart then creates the Secret.
  dockerConfigJson: {}
  #  auths:
  #    docker.io:
  #      auth: "<base64 user:token>"

  # CA certificates (PEM) of internal registries / Helm repositories (Harbor, Artifactory, Nexus...),
  # trusted in addition to the public CAs by kube-tower and Trivy: an existing ConfigMap...
  ca:
    existingConfigMap: ""
    key: ca.crt
    # ...or the certificates themselves, the chart then creates the ConfigMap.
    pem: ""

git:
  # Token for private git repositories (raw Chart.yaml reads): an existing Secret...
  existingSecret: ""
  secretKey: token
  # ...or the token itself, the chart then creates the Secret.
  token: ""

# Login on the UI and the API, the ArgoCD way (docs/authentication.md): on by default, the password of the
# built-in admin account in the Secret <release>-auth. false: anyone who reaches kube-tower can use it.
auth:
  enabled: true
  # Built-in `admin` account (admin role): its password is the key admin.password of the auth Secret.
  admin: true
  # Local accounts, their password in a Secret:
  #   - name: alice
  #     role: readonly          # readonly (sees everything) or admin (also runs scans, rescans, tests...)
  #     existingSecret: kube-tower-alice
  #     passwordKey: password
  users: []
  # Role of the visitors who are not logged in: "" (they must log in) or readonly.
  anonymousRole: ""
  sessionDuration: 24h
  # Secret with the keys admin.password and session.key (signs the sessions). Empty: <release>-auth, created
  # with random values by kube-tower at startup when it does not exist (like argocd-initial-admin-secret),
  # kept on upgrades and ArgoCD syncs. Set it to bring your own (ExternalSecret...).
  existingSecret: ""
  # /metrics stays open for Prometheus; false: it needs the Basic auth of a local user.
  metricsPublic: true
  # URL users open kube-tower with (with its sub-path), e.g. https://kube-tower.example.com/: needed by the
  # SSO, the provider sends the users back to <url>auth/callback.
  url: ""
  # Single sign-on with an OpenID Connect provider: Dex, Authentik, Keycloak, Entra ID, Okta...
  oidc:
    name: SSO                   # login button: "Log in with <name>"
    issuer: ""                  # empty: no SSO
    # Secret holding the client id and the client secret of kube-tower in the provider (keys below)
    existingSecret: ""
    clientIdKey: clientId
    clientSecretKey: clientSecret
    clientId: ""                # set to give the client id here instead of in the Secret
    scopes: [openid, profile, email, groups]
    usernameClaim: preferred_username
    groupsClaim: groups
    # Role from the groups: admin when in adminGroups, else readonly when in readonlyGroups, else defaultRole
    # ("" refuses the users in none of these groups)
    adminGroups: []
    readonlyGroups: []
    defaultRole: readonly
    # PEM file of the CA of a provider with a private CA (mount it with extraVolumes / extraVolumeMounts)
    caFile: ""

# Dex served by kube-tower on <auth.url>api/dex, like ArgoCD (needs auth.enabled and auth.url): users log in
# with its connectors (GitHub, GitLab, LDAP, SAML, Google, Microsoft, OIDC...). kube-tower is its OIDC client;
# the client secret is generated in the auth Secret (key dex.clientSecret). The roles come from the groups,
# set with auth.oidc.adminGroups, readonlyGroups and defaultRole.
dex:
  enabled: false
  name: Dex                      # login button: "Log in with <name>"
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.41.1
    pullPolicy: IfNotPresent
  # Dex connectors (https://dexidp.io/docs/connectors/). Secrets as $ENV_VARS from dex.env / dex.envFrom:
  #   - type: github
  #     id: github
  #     name: GitHub
  #     config:
  #       clientID: Iv1.0123456789
  #       clientSecret: $GITHUB_CLIENT_SECRET
  #       redirectURI: https://kube-tower.example.com/api/dex/callback
  #       orgs:
  #         - name: my-org
  connectors: []
  env: []
  envFrom: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kube-tower.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  # Requires the Prometheus operator CRDs. See docs/metrics.md for the exported metrics.
  enabled: false
  interval: 5m
  scrapeTimeout: ""
  # Extra labels, e.g. to match the serviceMonitorSelector of your Prometheus (release: kube-prometheus-stack)
  labels: {}
  metricRelabelings: []

# Grafana dashboard (dashboards/kube-tower.json) shipped as a ConfigMap for the Grafana sidecar
# (kube-prometheus-stack, or the grafana chart with sidecar.dashboards.enabled=true).
grafanaDashboard:
  enabled: false
  # Namespace watched by the sidecar; defaults to the release namespace
  namespace: ""
  # Label the sidecar looks for (sidecar.dashboards.label / labelValue)
  labels:
    grafana_dashboard: "1"
  # e.g. grafana_folder: Kubernetes (with sidecar.dashboards.folderAnnotation=grafana_folder)
  annotations: {}

trivy:
  # The Trivy CLI is not in the kube-tower image: an init container copies it from the official
  # Trivy image at pod start. That image has no linux/arm/v7 variant: on such nodes set
  # enabled: false (Trivy Operator reports still work) or use your own image.
  enabled: true
  image:
    repository: ghcr.io/aquasecurity/trivy
    tag: "0.75.0"
    pullPolicy: IfNotPresent
  # emptyDir holding the Trivy vulnerability database in standalone mode (no server)
  cacheSizeLimit: 3Gi
  # Trivy server (client/server mode): it holds and refreshes the vulnerability database, kube-tower
  # only sends the image layers analysis. Use it to keep the kube-tower pod small.
  server:
    enabled: false
    # Defaults to trivy.image
    image: {}
    port: 4954
    cacheSizeLimit: 3Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}

# NetworkPolicies for the kube-tower pod and the Trivy server (needs a CNI that enforces them).
networkPolicy:
  enabled: false
  ingress:
    # Who may reach the UI, API and /metrics (ingress controller, Prometheus...). Empty: any pod, port http only.
    # e.g. - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
    from: []
  egress:
    # Kubernetes API servers (in-cluster and remote), registries, Helm repositories, git hosts and the
    # Trivy database registries. Add the ports of registries or API servers that use other ones.
    ports:
      - port: 443
        protocol: TCP
      - port: 6443
        protocol: TCP
    # Restrict these destinations (ipBlock...). Empty: anywhere.
    to: []
    # Extra egress rules of the kube-tower pod, as is
    extra: []

podAnnotations: {}
# Extra pod labels, e.g. azure.workload.identity/use: "true" for Azure Workload Identity
podLabels: {}

# Extra init containers, env vars, volumes and mounts of the kube-tower pod, e.g. to copy the
# exec plugin of a managed cluster (kubelogin, aws-iam-authenticator...), see docs/clusters.md.
extraInitContainers: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Probes on /healthz (the httpGet part is set by the chart, set a probe to null to disable it).
# The startup probe gives the application up to 5 minutes to start (slow nodes, e.g. ARM boards)
# before the liveness probe takes over.
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Trivy scans (standalone mode) need more memory than the inventory alone
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1536Mi

nodeSelector: {}
tolerations: []
affinity: {}
