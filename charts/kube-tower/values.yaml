image:
  repository: ghcr.io/arcanexus/kube-tower
  # Defaults to the chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# kube-tower is stateless and keeps its inventory in memory: keep a single replica.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # ClusterRole with read-only access to workloads, nodes and ArgoCD Applications
  create: true

# Application settings, rendered into the kube-tower ConfigMap (config.yaml).
# See docs/configuration.md for every option.
config:
  refreshInterval: 6h
  logs:
    level: INFO
    format: json
  clusters:
    inCluster: true
    inClusterName: in-cluster
    # Cluster Secrets of `clusters` below are read by name (get on these Secrets only). Set
    # listSecrets to also find the Secrets of the namespace labelled with secretLabelSelector (e.g.
    # created by ExternalSecrets): it needs `list` on secrets, which reads EVERY Secret of the namespace.
    listSecrets: false
    secretLabelSelector: kube-tower.arcanexus.com/secret-type=cluster
    # Reuse ArgoCD cluster secrets. Without argocdSecretNames they are listed, which gives read access
    # to EVERY Secret of argocdNamespace (argocd-secret, repository credentials...): prefer listing the
    # names of the ArgoCD cluster Secrets in argocdSecretNames.
    useArgocdSecrets: false
    argocdNamespace: argocd
    argocdSecretNames: []
    # Commands that kubeconfig exec plugins may run, as written in the kubeconfig (e.g.
    # /opt/kube-tower/bin/kubelogin). Empty: exec plugins are refused. See docs/clusters.md.
    execCommands: []
  images:
    includeNodeImages: true
    includePrerelease: false
    checkFloatingDigests: true
    # Read the published digests of the current and latest tags (shown in the image details)
    fetchTagDigests: true
    ignore: []
  helm:
    applicationNamespaces:
      - argocd
    includePrerelease: false
    checkDependencies: true
  # Known vulnerabilities (CVE) of the images, see docs/vulnerabilities.md
  vulnerabilities:
    enabled: true
    # Read the VulnerabilityReports of Trivy Operator in the clusters where it is installed
    trivyOperator: true
    trivy:
      # Scan with the Trivy CLI the images without a Trivy Operator report (binary from trivy.image)
      enabled: true
      # Trivy server URL (client/server mode); set automatically when trivy.server.enabled is true
      serverUrl: ""
      timeout: 10m
      concurrency: 2
      # Images are scanned again after this delay, to find newly published CVEs
      rescanInterval: 24h
      ignoreUnfixed: false
      # Java DB (~1.5 GB more in the cache) to scan Java archives (jar, war...), skipped when disabled
      javaDb: false
    # Images never scanned (fnmatch patterns on registry/repository)
    ignore: []

# Remote clusters to register (see docs/clusters.md). Each entry either:
#  - creates a Secret in the kube-tower cluster format (ArgoCD layout or kubeconfig), or
#  - references an existing Secret by name (existingSecret), e.g. one generated by ExternalSecrets.
# Any Secret labelled kube-tower.arcanexus.com/secret-type=cluster in the release namespace is also
# used, without listing it here. Prefer existing Secrets to keep tokens out of git.
clusters: []
#  - name: prod
#    server: https://prod.example.com:6443
#    config:
#      bearerToken: "<token>"
#      tlsClientConfig:
#        caData: "<base64 PEM>"
#  - name: lab
#    kubeconfig: |
#      apiVersion: v1
#      kind: Config
#      ...
#  # Existing Secret (name/server/config or kubeconfig keys), its labels do not matter
#  - existingSecret: staging-cluster

registries:
  # Per registry credentials, for private registries / Helm repositories and to avoid
  # Docker Hub rate limits, mounted read-only from one Secret per registry.
  # Applies to container registries, OCI Helm registries and HTTP Helm repositories (basic auth).
  # Either reference an existing Secret (existingSecret wins) or give the password inline and the
  # chart creates the Secret.
  credentials: []
  #  - registry: docker.io
  #    existingSecret: dockerhub-credentials
  #    usernameKey: username   # optional, omit for token-only registries
  #    passwordKey: password   # password or access token
  #  - registry: ghcr.io
  #    existingSecret: ghcr-token
  #    passwordKey: token
  #  - registry: quay.io        # Secret created by the chart
  #    username: robot          # optional, kept in the ConfigMap
  #    password: "<token>"

  # Alternatively (or in addition), a kubernetes.io/dockerconfigjson Secret holding credentials
  # for several registries at once: an existing one...
  existingSecret: ""
  # ...or its content (an object, or a JSON string), the chart then creates the Secret.
  dockerConfigJson: {}
  #  auths:
  #    docker.io:
  #      auth: "<base64 user:token>"

git:
  # Token for private git repositories (raw Chart.yaml reads): an existing Secret...
  existingSecret: ""
  secretKey: token
  # ...or the token itself, the chart then creates the Secret.
  token: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kube-tower.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  # Requires the Prometheus operator CRDs. See docs/metrics.md for the exported metrics.
  enabled: false
  interval: 5m
  scrapeTimeout: ""
  # Extra labels, e.g. to match the serviceMonitorSelector of your Prometheus (release: kube-prometheus-stack)
  labels: {}
  metricRelabelings: []

# Grafana dashboard (dashboards/kube-tower.json) shipped as a ConfigMap for the Grafana sidecar
# (kube-prometheus-stack, or the grafana chart with sidecar.dashboards.enabled=true).
grafanaDashboard:
  enabled: false
  # Namespace watched by the sidecar; defaults to the release namespace
  namespace: ""
  # Label the sidecar looks for (sidecar.dashboards.label / labelValue)
  labels:
    grafana_dashboard: "1"
  # e.g. grafana_folder: Kubernetes (with sidecar.dashboards.folderAnnotation=grafana_folder)
  annotations: {}

trivy:
  # The Trivy CLI is not in the kube-tower image: an init container copies it from the official
  # Trivy image at pod start. That image has no linux/arm/v7 variant: on such nodes set
  # enabled: false (Trivy Operator reports still work) or use your own image.
  enabled: true
  image:
    repository: ghcr.io/aquasecurity/trivy
    tag: "0.75.0"
    pullPolicy: IfNotPresent
  # emptyDir holding the Trivy vulnerability database in standalone mode (no server)
  cacheSizeLimit: 3Gi
  # Trivy server (client/server mode): it holds and refreshes the vulnerability database, kube-tower
  # only sends the image layers analysis. Use it to keep the kube-tower pod small.
  server:
    enabled: false
    # Defaults to trivy.image
    image: {}
    port: 4954
    cacheSizeLimit: 3Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}

podAnnotations: {}
# Extra pod labels, e.g. azure.workload.identity/use: "true" for Azure Workload Identity
podLabels: {}

# Extra init containers, env vars, volumes and mounts of the kube-tower pod, e.g. to copy the
# exec plugin of a managed cluster (kubelogin, aws-iam-authenticator...), see docs/clusters.md.
extraInitContainers: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Probes on /healthz (the httpGet part is set by the chart, set a probe to null to disable it).
# The startup probe gives the application up to 5 minutes to start (slow nodes, e.g. ARM boards)
# before the liveness probe takes over.
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Trivy scans (standalone mode) need more memory than the inventory alone
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1536Mi

nodeSelector: {}
tolerations: []
affinity: {}
