# Registers a remote cluster. Create it in the namespace where kube-tower runs.
# Same layout as an ArgoCD cluster secret; prefer ExternalSecrets to keep the token out of git.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-prod
  namespace: kube-tower
  labels:
    kube-tower.arcanexus.com/secret-type: cluster
type: Opaque
stringData:
  name: prod
  server: https://prod.example.com:6443
  config: |
    {
      "bearerToken": "<token of kube-tower-reader>",
      "tlsClientConfig": {
        "caData": "<base64 ca.crt>",
        "insecure": false
      }
    }
