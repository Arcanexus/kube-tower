# Apply on every remote cluster kube-tower should scan:
#   kubectl apply -f remote-cluster-rbac.yaml
# Then read the token and CA to build the cluster Secret (see docs/clusters.md):
#   kubectl -n kube-tower get secret kube-tower-reader-token -o jsonpath='{.data.token}' | base64 -d
#   kubectl -n kube-tower get secret kube-tower-reader-token -o jsonpath='{.data.ca\.crt}'
apiVersion: v1
kind: Namespace
metadata:
  name: kube-tower
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-tower-reader
  namespace: kube-tower
---
apiVersion: v1
kind: Secret
metadata:
  name: kube-tower-reader-token
  namespace: kube-tower
  annotations:
    kubernetes.io/service-account.name: kube-tower-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-tower-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # Flux HelmReleases and their sources (Helm charts deployed by Flux), when Flux is installed
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories", "gitrepositories", "ocirepositories"]
    verbs: ["get", "list"]
  # Trivy Operator reports, when it is installed (vulnerabilities of the images, and the Security page)
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - configauditreports
      - clusterconfigauditreports
      - exposedsecretreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
      - infraassessmentreports
      - clusterinfraassessmentreports
      - clustercompliancereports
    verbs: ["get", "list"]
  # krr (CPU and memory recommendations, resources.enabled / krr.enabled of the chart): the workloads it
  # analyses, and Prometheus found in the cluster and reached through the API server (services/proxy)
  # when resources.prometheus gives no URL
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  # Image pull secrets of the workloads, only with registries.useImagePullSecrets: true (reads any
  # Secret whose name is known, see docs/registries.md)
  # - apiGroups: [""]
  #   resources: ["secrets"]
  #   verbs: ["get"]
  # Charts installed with the helm command, only with helm.releases: true (lists every Secret of the
  # cluster to find the release Secrets, owner=helm; see docs/chart-sources.md)
  # - apiGroups: [""]
  #   resources: ["secrets"]
  #   verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-tower-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-tower-reader
subjects:
  - kind: ServiceAccount
    name: kube-tower-reader
    namespace: kube-tower
