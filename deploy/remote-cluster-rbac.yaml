# Apply on every remote cluster kube-tower should scan:
#   kubectl apply -f remote-cluster-rbac.yaml
# Then read the token and CA to build the cluster Secret (see docs/clusters.md):
#   kubectl -n kube-tower get secret kube-tower-reader-token -o jsonpath='{.data.token}' | base64 -d
#   kubectl -n kube-tower get secret kube-tower-reader-token -o jsonpath='{.data.ca\.crt}'
apiVersion: v1
kind: Namespace
metadata:
  name: kube-tower
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-tower-reader
  namespace: kube-tower
---
apiVersion: v1
kind: Secret
metadata:
  name: kube-tower-reader-token
  namespace: kube-tower
  annotations:
    kubernetes.io/service-account.name: kube-tower-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-tower-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # Trivy Operator reports, when it is installed
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-tower-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-tower-reader
subjects:
  - kind: ServiceAccount
    name: kube-tower-reader
    namespace: kube-tower
