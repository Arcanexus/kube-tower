[project]
name = "kube-tower"
version = "0.1.0"
description = "Read-only dashboard of outdated container images and Helm charts across Kubernetes clusters"
requires-python = ">=3.13"
license = "Apache-2.0"

[tool.pytest.ini_options]
addopts = "-ra -v --cov=kube_tower --cov-report term-missing --cov-report xml --cov-report html"
pythonpath = ["src"]
asyncio_mode = "auto"
required_plugins = ["pytest-cov", "pytest-asyncio"]

[tool.coverage.run]
branch = true
source = ["kube_tower"]

[tool.coverage.report]
# CI fails if coverage drops below this threshold
fail_under = 90
skip_covered = false

[tool.ruff]
line-length = 130
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
